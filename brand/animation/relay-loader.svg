<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 100 100" fill="none" role="img" aria-label="Relay loading"><style>/* Relay loader, 3s loop. Base styles are the finished logo, so reduced-motion users see it still.
   Each property has its own animation so moves overlap and flow into each other instead of waiting in turn:
   dot pops, stack drops in, the stack slides left while the top-right tile pops and the leg draws, then a short hold. */
.rl-ember,
.rl-ink-bl,
.rl-ink-tr {
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: no-preference) {
  .rl-anim .rl-ember { animation: rl-ember-s 3s infinite, rl-ember-y 3s infinite, rl-ember-x 3s infinite, rl-o-ember 3s infinite; }
  .rl-anim .rl-ink-bl { animation: rl-bl-s 3s infinite, rl-bl-y 3s infinite, rl-ember-x 3s infinite, rl-o-bl 3s infinite; }
  .rl-anim .rl-ink-tr { animation: rl-tr-s 3s infinite, rl-o-tr 3s infinite; }
  .rl-anim .rl-leg { animation: rl-leg 3s infinite; }
}
@keyframes rl-ember-s {
  0% { scale: 0.2; animation-timing-function: cubic-bezier(0.34, 1.45, 0.64, 1); }
  14% { scale: 0.8; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
  34%, 100% { scale: 1; }
}
@keyframes rl-ember-y {
  0%, 12% { translate: 0 24px; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
  34%, 100% { translate: 0 0; }
}
@keyframes rl-ember-x {
  0%, 20% { transform: translateX(24px); animation-timing-function: cubic-bezier(0.45, 0, 0.15, 1); }
  50%, 100% { transform: translateX(0); }
}
@keyframes rl-o-ember {
  0% { opacity: 0; }
  6%, 90% { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes rl-bl-s {
  0%, 12% { scale: 0.4; animation-timing-function: cubic-bezier(0.34, 1.45, 0.64, 1); }
  36%, 100% { scale: 1; }
}
@keyframes rl-bl-y {
  0%, 12% { translate: 0 -24px; animation-timing-function: cubic-bezier(0.34, 1.3, 0.64, 1); }
  36%, 100% { translate: 0 0; }
}
@keyframes rl-o-bl {
  0%, 12% { opacity: 0; }
  20%, 90% { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes rl-tr-s {
  0%, 40% { scale: 0.2; animation-timing-function: cubic-bezier(0.34, 1.45, 0.64, 1); }
  58%, 100% { scale: 1; }
}
@keyframes rl-o-tr {
  0%, 40% { opacity: 0; }
  46%, 90% { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes rl-leg {
  0%, 46% { opacity: 0; stroke-dasharray: 0.01 100; }
  50% { opacity: 1; stroke-dasharray: 0.01 100; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
  70%, 90% { opacity: 1; stroke-dasharray: 100 100; }
  100% { opacity: 0; stroke-dasharray: 100 100; }
}
</style><g class="rl-anim"><rect class="rl-ember" x="0" y="0" width="40" height="40" rx="11" fill="#ff4704"/>
<rect class="rl-ink-tr" x="48" y="0" width="40" height="40" rx="11" fill="#000000"/>
<rect class="rl-ink-bl" x="0" y="48" width="40" height="40" rx="11" fill="#000000"/>
<path class="rl-leg" d="M58 57L77 77" pathLength="100" stroke="#ff4704" stroke-width="20" stroke-linecap="round" fill="none" stroke-dasharray="100 100"/></g></svg>
