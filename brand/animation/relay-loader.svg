<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 100 100" fill="none" role="img" aria-label="Relay loading"><style>/* Relay loader. Base styles are the finished logo, so reduced-motion users see it still. Duration 3.2s, loops. */
.rl-ember,
.rl-ink-bl,
.rl-ink-tr {
  transform-box: fill-box;
  transform-origin: center;
}
@media (prefers-reduced-motion: no-preference) {
  .rl-anim .rl-ember { animation: rl-ember 3.2s infinite; }
  .rl-anim .rl-ink-bl { animation: rl-ink-bl 3.2s infinite; }
  .rl-anim .rl-ink-tr { animation: rl-ink-tr 3.2s infinite; }
  .rl-anim .rl-leg { animation: rl-leg 3.2s infinite; }
}
@keyframes rl-ember {
  0% { opacity: 0; transform: translate(24px, 24px) scale(0.2); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
  9%, 17% { opacity: 1; transform: translate(24px, 24px) scale(0.75); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
  30%, 52% { opacity: 1; transform: translate(24px, 0) scale(1); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
  68%, 88% { opacity: 1; transform: translate(0, 0) scale(1); }
  100% { opacity: 0; transform: translate(0, 0) scale(1); }
}
@keyframes rl-ink-bl {
  0%, 17% { opacity: 0; transform: translate(24px, -24px) scale(0.4); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
  30%, 52% { opacity: 1; transform: translate(24px, 0) scale(1); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
  68%, 88% { opacity: 1; transform: translate(0, 0) scale(1); }
  100% { opacity: 0; transform: translate(0, 0) scale(1); }
}
@keyframes rl-ink-tr {
  0%, 50% { opacity: 0; transform: scale(0.2); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
  64%, 88% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1); }
}
@keyframes rl-leg {
  0%, 52% { opacity: 0; stroke-dasharray: 0.01 100; }
  58% { opacity: 1; stroke-dasharray: 0.01 100; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
  76%, 88% { opacity: 1; stroke-dasharray: 100 100; }
  100% { opacity: 0; stroke-dasharray: 100 100; }
}
</style><g class="rl-anim"><rect class="rl-ember" x="0" y="0" width="40" height="40" rx="11" fill="#ff4704"/>
<rect class="rl-ink-tr" x="48" y="0" width="40" height="40" rx="11" fill="#000000"/>
<rect class="rl-ink-bl" x="0" y="48" width="40" height="40" rx="11" fill="#000000"/>
<path class="rl-leg" d="M58 57L77 77" pathLength="100" stroke="#ff4704" stroke-width="20" stroke-linecap="round" fill="none" stroke-dasharray="100 100"/></g></svg>
