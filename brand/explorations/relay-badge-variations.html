<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Relay badge variations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --ember:#ff4704; --ink:#000; --graphite:#44403b; --smoke:#777169;
    --stone:#ebe8e4; --taupe:#f5f3f1; --egg:#fdfcfc; --night:#0c0b0a;
  }
  *{box-sizing:border-box;margin:0}
  body{width:1536px;height:440px;background:var(--taupe);font-family:Inter,sans-serif;color:var(--graphite);position:relative;overflow:hidden}
  .card{position:absolute;border-radius:20px;background:var(--egg);border:1px solid var(--stone)}
  .top{top:20px;height:425px;width:368px}
  .lbl{position:absolute;left:30px;top:26px;font-size:15px;color:var(--smoke);letter-spacing:.14px}
  .lbl b{font-weight:400;color:var(--ash,#a59f97);margin-right:14px}
  .logo{position:absolute;left:0;right:0;top:100px;height:130px;display:flex;align-items:center;justify-content:center;gap:16px}
  .wm{font-weight:600;font-size:62px;letter-spacing:-.045em;line-height:1}
  .sep{position:absolute;left:30px;right:30px;top:282px;height:1px;background:var(--stone)}
  .icons{position:absolute;left:0;right:0;top:304px;display:flex;justify-content:space-around;padding:0 18px}
  .ic{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:14px;color:var(--smoke)}
  .tile{width:72px;height:72px;border-radius:18px;display:flex;align-items:center;justify-content:center}
  .tile.fav{background:var(--taupe);width:60px;height:60px;border-radius:14px;margin:6px 0}
  .tile.out{border:1.5px solid var(--ember);background:var(--egg)}
  .row2{top:461px;height:212px}
  .dark{background:var(--night);border-color:var(--night);color:#fdfcfc}
  .row2 h4,.load h4{position:absolute;left:30px;top:26px;font-size:17px;font-weight:400;letter-spacing:.14px}
  .center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:14px;padding-top:30px}
  .grad{background:linear-gradient(120deg,#ff4704 0%,#ff5a2a 45%,#ff9a6e 100%);border:0}
  .load{left:20px;top:689px;width:1496px;height:315px}
  .frames{position:absolute;left:30px;top:70px;display:flex;gap:30px;align-items:flex-start}
  .fr{display:flex;flex-direction:column;align-items:center;gap:16px;font-size:15px;color:#e8e5e1}
  .fr .box{width:166px;height:158px;border-radius:20px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center}
  .arrow{align-self:flex-start;margin-top:70px;color:#8f8a84;font-size:20px;margin-left:-14px;margin-right:-14px}
  .vsep{position:absolute;left:1122px;top:30px;bottom:30px;width:1px;background:rgba(255,255,255,.1)}
  .prev{position:absolute;left:1123px;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  .prev .wm{font-size:44px;color:var(--ember)}
  .dots{display:flex;gap:9px;margin-top:6px}
  .dots i{width:9px;height:9px;border-radius:9px;background:var(--ember)}
  .dots i:nth-child(2){opacity:.5}.dots i:nth-child(3){opacity:.22}
  .cap{position:absolute;bottom:26px;font-size:15px;color:#e8e5e1}
  svg{display:block;overflow:visible}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- G1: Hand-off R. stem + bowl, detached leg -->
    <symbol id="g1" viewBox="0 0 64 64">
      <path d="M18 57V12H33a11 11 0 0 1 0 22H18" fill="none" stroke="var(--a,#ff4704)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M35 46L47 57" fill="none" stroke="var(--b,#000)" stroke-width="11" stroke-linecap="round"/>
    </symbol>
    <!-- G2: R with message dot -->
    <symbol id="g2" viewBox="0 0 64 64">
      <path d="M18 57V12H33a11 11 0 0 1 0 22H18" fill="none" stroke="var(--a,#ff4704)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="44" cy="52" r="7" fill="var(--b,#000)"/>
    </symbol>
    <!-- G3: Baton pass, two bars and a dot -->
    <symbol id="g3" viewBox="0 0 64 64">
      <path d="M14 43L36 21" stroke="var(--a,#ff4704)" stroke-width="14" stroke-linecap="round"/>
      <path d="M27 54L47 34" stroke="var(--b,#000)" stroke-width="14" stroke-linecap="round"/>
      <circle cx="49" cy="15" r="6" fill="var(--a,#ff4704)"/>
    </symbol>
  </defs>
</svg>

<div class="card top" style="left:20px;height:400px">
  <div class="lbl"><b>05</b>Ink Badge</div>
  <div class="logo" style="top:90px"><div class="tile" style="background:#000;width:92px;height:92px;border-radius:26px;"><svg width="62" height="62" style="--a:#ff4704;--b:#fdfcfc"><use href="#g1"/></svg></div><span class="wm" style="color:#000;font-size:58px">Relay</span></div>
  <div class="sep" style="top:250px"></div>
  <div class="icons" style="top:272px"><div class="ic"><div class="tile" style="background:#000;width:72px;height:72px;border-radius:18px;"><svg width="46" height="46" style="--a:#ff4704;--b:#fdfcfc"><use href="#g1"/></svg></div>App Icon</div><div class="ic"><div class="tile fav"><svg width="32" height="32" style="--a:#000;--b:#ff4704"><use href="#g1"/></svg></div>Favicon</div><div class="ic"><div class="tile out" style="border-color:#000"><svg width="46" height="46" style="--a:#000;--b:#ff4704"><use href="#g1"/></svg></div>Icon (Outline)</div></div>
  
</div><div class="card top" style="left:404px;height:400px">
  <div class="lbl"><b>06</b>Circle Badge</div>
  <div class="logo" style="top:90px"><div class="tile" style="background:#ff4704;width:92px;height:92px;border-radius:50%;"><svg width="62" height="62" style="--a:#fff;--b:#fff"><use href="#g1"/></svg></div><span class="wm" style="color:var(--ember);font-size:58px;letter-spacing:-.05em">relay</span></div>
  <div class="sep" style="top:250px"></div>
  <div class="icons" style="top:272px"><div class="ic"><div class="tile" style="background:#ff4704;width:72px;height:72px;border-radius:50%;"><svg width="44" height="44" style="--a:#fff;--b:#fff"><use href="#g1"/></svg></div>App Icon</div><div class="ic"><div class="tile fav" style="border-radius:50%"><svg width="30" height="30" style="--a:#ff4704;--b:#ff4704"><use href="#g1"/></svg></div>Favicon</div><div class="ic"><div class="tile out" style="border-radius:50%"><svg width="44" height="44" style="--a:#ff4704;--b:#ff4704"><use href="#g1"/></svg></div>Icon (Outline)</div></div>
  
</div><div class="card top" style="left:788px;height:400px">
  <div class="lbl"><b>07</b>Two-Tone Badge</div>
  <div class="logo" style="top:90px"><div class="tile" style="background:#ff4704;width:92px;height:92px;border-radius:24px;"><svg width="62" height="62" style="--a:#fff;--b:#000"><use href="#g1"/></svg></div><span class="wm" style="color:#000;font-size:58px">Relay<span style="color:var(--ember)">.</span></span></div>
  <div class="sep" style="top:250px"></div>
  <div class="icons" style="top:272px"><div class="ic"><div class="tile" style="background:#ff4704;width:72px;height:72px;border-radius:18px;"><svg width="46" height="46" style="--a:#fff;--b:#000"><use href="#g1"/></svg></div>App Icon</div><div class="ic"><div class="tile fav"><svg width="32" height="32" style="--a:#ff4704;--b:#000"><use href="#g1"/></svg></div>Favicon</div><div class="ic"><div class="tile out"><svg width="46" height="46" style="--a:#ff4704;--b:#000"><use href="#g1"/></svg></div>Icon (Outline)</div></div>
  
</div><div class="card top" style="left:1172px;height:400px;width:344px">
  <div class="lbl"><b>08</b>Baton Badge</div>
  <div class="logo" style="top:90px"><div class="tile" style="background:#ff4704;width:92px;height:92px;border-radius:24px;"><svg width="62" height="62" style="--a:#fff;--b:#000"><use href="#g3"/></svg></div><span style="font-family:'Instrument Serif',serif;font-size:72px;line-height:1;color:#000;letter-spacing:-.02em">Relay</span></div>
  <div class="sep" style="top:250px"></div>
  <div class="icons" style="top:272px"><div class="ic"><div class="tile" style="background:#ff4704;width:72px;height:72px;border-radius:18px;"><svg width="46" height="46" style="--a:#fff;--b:#000"><use href="#g3"/></svg></div>App Icon</div><div class="ic"><div class="tile fav"><svg width="32" height="32" style="--a:#ff4704;--b:#000"><use href="#g3"/></svg></div>Favicon</div><div class="ic"><div class="tile out"><svg width="46" height="46" style="--a:#ff4704;--b:#000"><use href="#g3"/></svg></div>Icon (Outline)</div></div>
  
</div></body></html>
